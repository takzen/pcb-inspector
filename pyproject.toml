[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcb-inspector"
version = "0.1.0"
description = "Automated Multimodal Design Reviewer & Linter for KiCad Projects"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Krzysztof Pika", email = "takzen.app@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
pcb-inspector = "pcb_inspector.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_inspector"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/pcb_inspector"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["shapely.*"]
ignore_missing_imports = true
