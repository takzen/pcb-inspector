name: "PCB Inspector Review"
description: "Automated 3-layer design review and linter for KiCad projects (DRC, heuristics, vision AI)"
author: "Krzysztof Pika"
inputs:
  project_path:
    description: "Path to KiCad project file (.kicad_pro), layout (.kicad_pcb), or directory"
    required: true
    default: "."
  fail_on:
    description: "Severity threshold that fails the step: CRITICAL, WARNING, or SUGGESTION"
    required: false
    default: "CRITICAL"
  enable_vision:
    description: "Enable Layer 3 multimodal vision AI inspection"
    required: false
    default: "false"
  vision_model:
    description: "Vision AI model to use (gemini-3.8-flash, fable-5, gpt-6-astra, mock)"
    required: false
    default: "gemini-3.8-flash"
  config_file:
    description: "Optional custom .pcb-inspector.yaml configuration file"
    required: false
    default: ""
  output_dir:
    description: "Directory to write generated reports (markdown, json, html)"
    required: false
    default: "reports"
outputs:
  passed:
    description: "Whether the PCB inspection passed without violating fail_on threshold"
    value: ${{ steps.inspector.outputs.passed }}
  markdown_report:
    description: "Path to generated markdown report"
    value: "${{ inputs.output_dir }}/pcb_report.md"
  json_report:
    description: "Path to generated json report"
    value: "${{ inputs.output_dir }}/pcb_report.json"
  html_report:
    description: "Path to generated interactive HTML report"
    value: "${{ inputs.output_dir }}/pcb_report.html"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    # Layer 1 is the deterministic ground truth of the audit. Without kicad-cli
    # on PATH the action silently degrades to heuristics only, so it is
    # installed here and the run is made to fail if it is still missing.
    - name: Install KiCad CLI
      shell: bash
      # kicad-cli ships in the kicad package; there is no separate one. KiCad 10
      # opens boards from every earlier version, while KiCad 9 cannot open a
      # board saved by KiCad 10. Recommends would pull in 3 GB of libraries.
      run: |
        set -euo pipefail
        sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
        sudo apt-get update
        candidate=$(apt-cache policy kicad | awk '/Candidate:/ {print $2}')
        case "$candidate" in
          1[0-9].*)
            sudo apt-get install --yes --no-install-recommends kicad
            ;;
          *)
            # Ubuntu 26.04 runners read the amd64v3 index of every source that
            # lists one. The KiCad PPA lists it but publishes only documentation
            # there, so apt offers the distribution's KiCad ($candidate). Take
            # KiCad 10 from the PPA's plain index instead, checked against the
            # signed Release file apt has already verified.
            ppa=https://ppa.launchpadcontent.net/kicad/kicad-10.0-releases/ubuntu
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            index="main/binary-$(dpkg --print-architecture)/Packages.gz"
            release=/var/lib/apt/lists/ppa.launchpadcontent.net_kicad_kicad-10.0-releases_ubuntu_dists_${codename}_InRelease
            work=$(mktemp -d)
            curl -fsSL "$ppa/dists/$codename/$index" -o "$work/Packages.gz"
            want=$(awk -v f="$index" '/^SHA256:/ {s=1; next} /^[^ ]/ {s=0} s && $3 == f {print $1}' "$release")
            echo "$want  $work/Packages.gz" | sha256sum --check --quiet
            entry=$(gunzip -c "$work/Packages.gz" | awk -v RS= '/^Package: kicad\n/')
            file=$(printf '%s\n' "$entry" | awk '/^Filename:/ {print $2}')
            sum=$(printf '%s\n' "$entry" | awk '/^SHA256:/ {print $2}')
            curl -fsSL "$ppa/$file" -o "$work/kicad.deb"
            echo "$sum  $work/kicad.deb" | sha256sum --check --quiet
            sudo apt-get install --yes --no-install-recommends "$work/kicad.deb"
            ;;
        esac
        version=$(kicad-cli version)
        echo "kicad-cli $version"
        case "$version" in
          1[0-9].*) ;;
          *)
            echo "::error::KiCad 10 or newer is needed to open boards saved by KiCad 10; got $version"
            exit 1
            ;;
        esac

    # From the action's own checkout. "." is the calling repository, which in a
    # hardware project holds the boards, not this tool.
    - name: Install pcb-inspector
      shell: bash
      run: |
        uv pip install --system "${{ github.action_path }}/../../.."

    - name: Run pcb-inspector check
      id: inspector
      shell: bash
      run: |
        mkdir -p "${{ inputs.output_dir }}"
        
        VISION_FLAG="--no-vision"
        if [ "${{ inputs.enable_vision }}" = "true" ]; then
          VISION_FLAG="--vision --vision-model ${{ inputs.vision_model }}"
        fi

        CONFIG_ARG=""
        if [ -n "${{ inputs.config_file }}" ]; then
          CONFIG_ARG="--config ${{ inputs.config_file }}"
        fi

        set +e
        pcb-inspector check "${{ inputs.project_path }}" \
          --output "${{ inputs.output_dir }}/pcb_report" \
          --format all \
          --fail-on "${{ inputs.fail_on }}" \
          --require-kicad-cli \
          $VISION_FLAG \
          $CONFIG_ARG
        EXIT_CODE=$?
        set -e

        if [ -f "${{ inputs.output_dir }}/pcb_report.md" ]; then
          cat "${{ inputs.output_dir }}/pcb_report.md" >> $GITHUB_STEP_SUMMARY
        fi

        if [ $EXIT_CODE -eq 0 ]; then
          echo "passed=true" >> $GITHUB_OUTPUT
        else
          echo "passed=false" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        fi
