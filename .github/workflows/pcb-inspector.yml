name: "PCB Inspector action self-test"

# This repository holds the tool, not a product board, so the action is run on
# golden samples with known defects and must report them. It used to audit the
# repository root, which holds no board, and passed with nothing checked.

on:
  push:
    branches: [main, master]
    paths:
      - ".github/**"
      - "src/**"
      - "pyproject.toml"
      - "tests/golden_samples/**"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/**"
      - "src/**"
      - "pyproject.toml"
      - "tests/golden_samples/**"
  workflow_dispatch:

jobs:
  flawed-board:
    name: Flags a flawed board (${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: "KiCad 8 file"
            board: "tests/golden_samples/flawed_board"
          - format: "KiCad 10 file"
            board: "tests/golden_samples/kicad10_format/flawed_board.kicad_pcb"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Expected to fail: the board has CRITICAL defects.
      - name: Run PCB Inspector
        id: review
        continue-on-error: true
        uses: ./.github/actions/pcb-inspector
        with:
          project_path: ${{ matrix.board }}
          fail_on: "CRITICAL"
          output_dir: "build/reports"

      # A failed step alone proves little: a usage error or a crash also fails.
      # The report must show that DRC and the heuristics both ran and found defects.
      - name: Check the defects were found
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.review.outcome }}" = "failure"
          test "${{ steps.review.outputs.passed }}" = "false"
          python3 - <<'PY'
          import json

          report = json.load(open("build/reports/pcb_report.json", encoding="utf-8"))
          layers = report["metadata"]["layers"]
          assert layers["layer1_drc_erc"] == "executed", layers
          assert layers["layer2_heuristics"] == "executed", layers

          critical = [f for f in report["findings"] if f["severity"] == "CRITICAL"]
          categories = {f["category"] for f in critical}
          assert "DRC_ERC" in categories, categories
          assert "DECOUPLING" in categories, categories
          print(f"{len(critical)} CRITICAL findings across {sorted(categories)}")
          PY

      - name: Upload Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcb-inspector-reports-${{ strategy.job-index }}
          path: build/reports/
